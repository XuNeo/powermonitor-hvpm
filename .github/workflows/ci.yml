name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  QT_QPA_PLATFORM: offscreen
  QT_API: pyside6

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.10'
          - os: ubuntu-latest
            python-version: '3.11'
          - os: ubuntu-latest
            python-version: '3.12'
          - os: ubuntu-latest
            python-version: '3.13'
          - os: macos-latest
            python-version: '3.10'
          - os: macos-latest
            python-version: '3.13'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.7'
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install Linux Qt runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libegl1
      - name: Install locked dependencies
        run: uv sync --locked --extra test --group release
      - name: Check installed dependencies
        run: uv pip check
      - name: Run validation suite
        run: uv run python tools/validate.py

  build:
    name: Build distributions
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.7'
          enable-cache: true
          python-version: '3.13'
      - name: Install locked release tools
        run: uv sync --locked --group release
      - name: Build wheel and source distribution
        run: uv build
      - name: Validate distributions
        run: |
          uv run --group release twine check --strict dist/*
          uv run python tools/check_distribution.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  wheel-smoke:
    name: Wheel smoke (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - name: Install Linux Qt runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libegl1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install wheel in clean environment
        shell: bash
        run: |
          python -m venv smoke-venv
          smoke-venv/bin/python -m pip install --upgrade pip
          smoke-venv/bin/python -m pip install dist/*.whl
          smoke-venv/bin/python -m pip check
      - name: Validate installed command and private SDK
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          smoke-venv/bin/powermonitor --help
          smoke-venv/bin/python -c 'import importlib.util; assert importlib.util.find_spec("Monsoon") is None; import powermonitor._vendor.pymonsoon'
          smoke-venv/bin/powermonitor --screenshot wheel-smoke.png
          test -s wheel-smoke.png
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-smoke-${{ matrix.os }}
          path: wheel-smoke.png
          if-no-files-found: error
